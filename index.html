<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fake Calculator 😂</title>

<style>
body{
    margin:0;
    background:#111;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.calc{
    background:#222;
    padding:20px;
    border-radius:20px;
    width:320px;
    box-shadow:0 0 20px #000;
}

h2{
    color:red;
    text-align:center;
}

p{
    color:#aaa;
    text-align:center;
    margin-top:-10px;
}

#display{
    width:100%;
    height:60px;
    font-size:30px;
    margin-bottom:15px;
    text-align:right;
    border:none;
    border-radius:10px;
    padding-right:10px;
}

button{
    width:70px;
    height:60px;
    margin:3px;
    font-size:22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.num{background:#444;color:white;}
.op{background:orange;color:white;}
.equal{background:green;color:white;}
.clear{background:red;color:white;}
</style>

</head>
<body>

<div class="calc">

<h2>😂 Fake Calculator</h2>
<p>⚠️ This calculator gives fake answers for fun.</p>

<input id="display" readonly>

<br>

<button class="num" onclick="add('7')">7</button>
<button class="num" onclick="add('8')">8</button>
<button class="num" onclick="add('9')">9</button>
<button class="op" onclick="add('/')">÷</button>

<br>

<button class="num" onclick="add('4')">4</button>
<button class="num" onclick="add('5')">5</button>
<button class="num" onclick="add('6')">6</button>
<button class="op" onclick="add('*')">×</button>

<br>

<button class="num" onclick="add('1')">1</button>
<button class="num" onclick="add('2')">2</button>
<button class="num" onclick="add('3')">3</button>
<button class="op" onclick="add('-')">-</button>

<br>

<button class="clear" onclick="clr()">C</button>
<button class="num" onclick="add('0')">0</button>
<button class="equal" onclick="fake()">=</button>
<button class="op" onclick="add('+')">+</button>

</div>

<script>

let display=document.getElementById("display");

function add(x){
display.value+=x;
}

function clr(){
display.value="";
}

function fake(){

let answers=[
"11",
"Banana 🍌",
"999999",
"Error 😂",
"Fish 🐟",
"Infinity",
"Bruh 🤣",
"42",
"NOPE",
"Your IQ 📈"
];

display.value=answers[Math.floor(Math.random()*answers.length)];

}

</script>

</body>
</html>
