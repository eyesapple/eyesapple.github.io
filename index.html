<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Eyes Chess</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body{
    background:#1b1b1b;
    color:white;
    text-align:center;
    font-family:Arial;
}

#board{
    width:400px;
    margin:20px auto;
}

h1{
    color:gold;
}
</style>
</head>
<body>

<h1>♟️ Eyes Chess</h1>
<p>Play chess for free.</p>

<div id="board"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
var game = new Chess();

var board = Chessboard('board', {
    draggable: true,
    position: 'start',
    onDrop: function(source, target) {

        var move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if(move === null){
            return 'snapback';
        }
    }
});
</script>

</body>
</html>
